services:
  pingpanda:
    image: ghcr.io/kingpin/pingpanda:latest
    container_name: pingpanda
    environment:
      # Logging configuration
      - LOG_DIR=/logs
      - LOG_FILE=pingpanda.log
      - LOG_LEVEL=INFO
      - LOG_TO_TERMINAL=true
      - LOG_TO_FILE=true
      - MAX_LOG_SIZE=1048576
      - LOG_BACKUP_COUNT=5
      
      # Core settings
      - INTERVAL=15
      - VERBOSE=true
      - RETRY_COUNT=3
      - JITTER_SECONDS=5
      
      # Check enablement
      - ENABLE_PING=true
      - ENABLE_DNS=true
      - ENABLE_WEBSITE_CHECK=true
      - ENABLE_SSL_CHECK=false
      
      # Check targets
      - DOMAINS=google.com,yahoo.com
      - PING_IPS=8.8.8.8,1.1.1.1
      - CHECK_WEBSITE=https://www.google.com
      - SSL_CHECK_DOMAINS=google.com,yahoo.com
      
      # Check configuration
      - SUCCESS_HTTP_CODES=200,201,202
      - SSL_WARN_DAYS=30
      - SSL_CRITICAL_DAYS=7
      
      # Notification settings
      - SLACK_WEBHOOK_URL=
      - TEAMS_WEBHOOK_URL=
      - DISCORD_WEBHOOK_URL=
      - ALERT_THRESHOLD=3
      - NOTIFY_RECOVERY=true

      # Prometheus settings
      - ENABLE_PROMETHEUS=true
      - PROMETHEUS_PORT=9090
      # Bind to 0.0.0.0 inside Docker so the port mapping below works.
      # On bare-metal leave this unset (defaults to 127.0.0.1).
      - PROMETHEUS_BIND_ADDRESS=0.0.0.0
      
      # Advanced Statistics Configuration
      - ENABLE_ADVANCED_STATS=true
      - SUMMARY_INTERVAL_SECONDS=120
      - STORE_STATS_LOG=true
      - STATS_LOG_FORMAT=csv
      - STATS_LOG_MAX_SIZE=10485760
      - FLAP_THRESHOLD=3
      - FLAP_WINDOW_SECONDS=300
      - PERSIST_STATS=true
      
      # Filtering Options  
      - SHOW_ONLY_SUCCESS=false
      - SHOW_ONLY_FAILURE=false
      
      # Adaptive Backoff & Circuit Breaker (NEW!)
      - ENABLE_ADAPTIVE_BACKOFF=true
      - BACKOFF_MIN_SECONDS=10
      - BACKOFF_MAX_SECONDS=300
      - CIRCUIT_BREAKER_THRESHOLD=5
      - CIRCUIT_BREAKER_COOLDOWN_SECONDS=60
    volumes:
      - ./logs:/logs
    ports:
      - "9090:9090"
    healthcheck:
      # Probe the Prometheus /metrics endpoint; adjust port if PROMETHEUS_PORT differs.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW  # Required for ping functionality