# PingPanda Configuration Example with Adaptive Backoff
# This demonstrates the new adaptive backoff and circuit breaker features

# Basic monitoring settings
INTERVAL=15
ENABLE_DNS=true
DOMAINS=google.com,github.com,example.com
ENABLE_PING=true
PING_IPS=8.8.8.8,1.1.1.1,192.168.1.1
ENABLE_WEBSITE_CHECK=true
CHECK_WEBSITE=https://google.com,https://github.com
ENABLE_SSL_CHECK=true
SSL_CHECK_DOMAINS=google.com:443,github.com:443

# Adaptive Backoff Settings (NEW!)
# Enable intelligent backoff when targets fail
ENABLE_ADAPTIVE_BACKOFF=true

# Minimum wait time after first failure (seconds)
BACKOFF_MIN_SECONDS=10

# Maximum wait time between checks (seconds)
# Backoff doubles after each failure: 10s → 20s → 40s → 80s → up to max
BACKOFF_MAX_SECONDS=300

# Circuit Breaker Settings (NEW!)
# Number of consecutive failures before circuit opens
# When circuit opens, target is not checked for cooldown period
CIRCUIT_BREAKER_THRESHOLD=5

# Cooldown period when circuit is open (seconds)
# After this period, one check attempt is made (half-open state)
CIRCUIT_BREAKER_COOLDOWN_SECONDS=60

# Retry settings
RETRY_COUNT=3

# Notification settings
ALERT_THRESHOLD=3
NOTIFY_RECOVERY=true

# Logging
LOG_LEVEL=INFO
VERBOSE=false
LOG_DIR=/logs

# Advanced stats (optional)
ENABLE_ADVANCED_STATS=true
SUMMARY_INTERVAL_SECONDS=300
STORE_STATS_LOG=true
PERSIST_STATS=true
FLAP_THRESHOLD=5
FLAP_WINDOW_SECONDS=300

# Prometheus metrics (optional)
ENABLE_PROMETHEUS=true
PROMETHEUS_PORT=9090

# Webhook notifications (optional)
# SLACK_WEBHOOK_URL=https://hooks.slack.com/services/YOUR/WEBHOOK/URL
# DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/YOUR/WEBHOOK
# TEAMS_WEBHOOK_URL=https://outlook.office.com/webhook/YOUR/WEBHOOK
