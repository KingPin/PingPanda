# Discord-only notifications.
services:
  pingpanda:
    image: ghcr.io/kingpin/pingpanda:latest
    container_name: pingpanda
    environment:
      - DOMAINS=google.com,github.com
      - PING_IPS=1.1.1.1
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_USERNAME=PingPanda
      - DISCORD_AVATAR_URL=https://raw.githubusercontent.com/KingPin/PingPanda/main/assets/icon.png
      - ALERT_THRESHOLD=3
      - NOTIFY_RECOVERY=true
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    restart: unless-stopped
