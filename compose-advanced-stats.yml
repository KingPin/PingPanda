services:
  pingpanda:
    image: ghcr.io/kingpin/pingpanda:latest
    container_name: pingpanda-advanced
    environment:
      # Logging configuration
      - LOG_DIR=/logs
      - LOG_FILE=pingpanda.log
      - LOG_LEVEL=INFO
      - LOG_TO_TERMINAL=true
      - LOG_TO_FILE=true
      - MAX_LOG_SIZE=1048576
      - LOG_BACKUP_COUNT=5
      
      # Core settings
      - INTERVAL=30
      - VERBOSE=true
      - RETRY_COUNT=3
      
      # Check enablement
      - ENABLE_PING=true
      - ENABLE_DNS=true
      - ENABLE_WEBSITE_CHECK=true
      - ENABLE_SSL_CHECK=true
      
      # Check targets
      - DOMAINS=google.com,github.com,stackoverflow.com
      - PING_IPS=8.8.8.8,1.1.1.1,208.67.222.222
      - CHECK_WEBSITE=https://www.google.com,https://github.com,https://stackoverflow.com
      - SSL_CHECK_DOMAINS=google.com,github.com,stackoverflow.com
      
      # Check configuration
      - SUCCESS_HTTP_CODES=200,201,202
      - SSL_WARN_DAYS=30
      - SSL_CRITICAL_DAYS=7
      
      # Notification settings
      - SLACK_WEBHOOK_URL=
      - TEAMS_WEBHOOK_URL=
      - DISCORD_WEBHOOK_URL=
      - ALERT_THRESHOLD=3
      - NOTIFY_RECOVERY=true

      # Prometheus settings
      - ENABLE_PROMETHEUS=true
      - PROMETHEUS_PORT=9090
      
      # === ADVANCED STATISTICS FEATURES ENABLED ===
      
      # Enable advanced ping statistics tracking
      - ENABLE_ADVANCED_STATS=true
      
      # Show detailed statistics summary every 5 minutes (300 seconds)
      - SUMMARY_INTERVAL=300
      
      # Statistics logging to CSV file
      - ENABLE_STATS_LOGGING=true
      - STATS_LOG_FILE=/logs/pingpanda_stats.csv
      - STATS_LOG_FORMAT=csv
      - LOG_ROTATION_SIZE=10485760  # 10MB
      
      # Flapping detection for unstable connections
      - FLAPPING_THRESHOLD=5        # 5 status changes
      - FLAPPING_WINDOW=600         # within 10 minutes
      
      # Persist statistics across container restarts
      - PERSIST_STATS=true
      - STATS_PERSISTENCE_FILE=/logs/pingpanda_stats.pkl
      
      # Filtering options (uncomment to enable)
      # - SHOW_ONLY_SUCCESS=true
      # - SHOW_ONLY_FAILURE=true
    volumes:
      - ./logs:/logs
      - ./stats:/stats  # Additional volume for statistics persistence
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW  # Required for ping functionality
    
    # Health check to ensure service is running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
