# PingPanda Configuration File - Advanced Statistics Example
# This configuration demonstrates all the new advanced statistics features

# Basic monitoring settings
CHECK_INTERVAL=10
PROMETHEUS_PORT=8000
DNS_SERVER=8.8.8.8
PING_TARGETS=8.8.8.8,1.1.1.1,google.com,github.com
WEBSITES=https://google.com,https://github.com,https://stackoverflow.com
SSL_HOSTS=google.com:443,github.com:443,stackoverflow.com:443

# Notification settings (optional)
SLACK_WEBHOOK=
TEAMS_WEBHOOK=
DISCORD_WEBHOOK=

# === ADVANCED STATISTICS FEATURES ===

# Enable advanced ping statistics tracking
ENABLE_ADVANCED_STATS=true

# Show detailed statistics summary every 5 minutes (300 seconds)
SUMMARY_INTERVAL=300

# === STATISTICS LOGGING ===
# Enable logging statistics to file
ENABLE_STATS_LOGGING=true

# Statistics log file path and format
STATS_LOG_FILE=pingpanda_stats.csv
STATS_LOG_FORMAT=csv

# Log file rotation when it reaches 10MB
LOG_ROTATION_SIZE=10485760

# === FLAPPING DETECTION ===
# Detect unstable connections that change status frequently
# Trigger flapping detection after 5 status changes
FLAPPING_THRESHOLD=5

# Consider status changes within 10 minutes (600 seconds) for flapping detection
FLAPPING_WINDOW=600

# === PERSISTENCE ===
# Save statistics across restarts
PERSIST_STATS=true

# File to store persistent statistics data
STATS_PERSISTENCE_FILE=pingpanda_stats.pkl

# === FILTERING OPTIONS ===
# Show only failed results (comment out to show all)
SHOW_ONLY_FAILURE=true

# Show only successful results (comment out to show all)  
# SHOW_ONLY_SUCCESS=true

# === Example Usage ===
# 1. Save this file as 'pingpanda_advanced.conf'
# 2. Run: python3 pingpanda.py -c pingpanda_advanced.conf
# 3. Watch the detailed statistics summaries every 5 minutes
# 4. Check the CSV log file for historical data
# 5. Stop and restart - statistics will be preserved
# 6. Monitor for flapping (unstable) connections

# === Features Enabled ===
# ✅ Per-IP status tracking with uptime/downtime
# ✅ Periodic statistics summaries  
# ✅ CSV/JSON logging with rotation
# ✅ Flapping detection for unstable connections
# ✅ Statistics persistence across restarts
# ✅ Overall availability calculations
# ✅ Detailed outage history
